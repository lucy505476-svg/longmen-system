name = "longmen-system"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# 只有本機開發設 true：開放未登入的後台頁面。正式環境必須是 false。
DEV_MODE = "false"

[[d1_databases]]
binding = "DB"
database_name = "longmen"
# 本機開發不需要真的 ID；部署前用 `wrangler d1 create longmen` 取得後填入
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# R2（藥單照片、打卡原始檔）在階段 1／9 需要時再加；啟用 R2 需先在 Cloudflare 綁定付款方式
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "longmen-files"
